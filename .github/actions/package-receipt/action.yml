# The last steps of a package job of package.yml, once its package passed every check and is
# uploaded: apps/desktop/scripts/package-receipt.ts, from the release's commit, writes a receipt
# binding the uploaded files to the commit, the run and the artifact, and this keeps it as an
# artifact of its own; docs/maintainers/releasing.md#package-receipts.
name: Package receipt
description: Write and keep the receipt of a package that passed its checks

inputs:
  platform:
    description: mac-arm64, linux-x64 or win-x64
    required: true
  distribution:
    description: direct, or store for the Microsoft Store package
    default: direct
  version:
    description: The release version
    required: true
  package-version:
    description: The package's own version, when it differs from the release's
    default: ""
  sha:
    description: The release's commit, checked out
    required: true
  artifact-name:
    required: true
  artifact-id:
    required: true
  artifact-digest:
    required: true
  retention-days:
    required: true

runs:
  using: composite
  steps:
    - name: Write successful package receipt
      shell: bash
      working-directory: apps/desktop
      env:
        PACKAGE_SOURCE: ${{ inputs.sha }}
        PACKAGE_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        PACKAGE_APP_VERSION: ${{ inputs.version }}
        PACKAGE_VERSION: ${{ inputs.package-version || inputs.version }}
        PACKAGE_PLATFORM: ${{ inputs.platform }}
        PACKAGE_DISTRIBUTION: ${{ inputs.distribution }}
        PACKAGE_RUN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        PACKAGE_ARTIFACT_ID: ${{ inputs.artifact-id }}
        PACKAGE_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        PACKAGE_ARTIFACT_SHA256: ${{ inputs.artifact-digest }}
      run: node scripts/package-receipt.ts
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: package-receipt-${{ inputs.platform }}-${{ inputs.distribution }}-${{ inputs.version }}-attempt-${{ github.run_attempt }}
        path: apps/desktop/package-receipt.json
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
