# Installs the newest published stable release on a disposable Windows runner, upgrades it to a
# published nightly, the candidate, on the same profile, and restarts the candidate, checking
# what each step keeps, the last with the subscription removed and the app and its ffmpeg blocked
# from the network. apps/desktop/test/e2e/installed-upgrade.ts runs it;
# docs/contributing/testing.md#installed-upgrade describes it.
#
# - A stable release run calls it with the nightly it promotes and the commit it planned, alongside
#   packaging, and publishes only once it passed. The nightly's tag must name exactly that commit.
# - By hand, from main, with the nightly to check; its tag gives the commit.
#
# It reads releases and publishes nothing: no release, feed, Store or tag, and it holds no secret.
# The run's evidence is kept 14 days; a failed run's profile 7.
name: Upgrade check

on:
  workflow_call:
    inputs:
      candidate:
        description: The published nightly to upgrade to, by tag
        type: string
        required: true
      sha:
        description: The commit the release planned, which the candidate's tag must name
        type: string
        required: true
  workflow_dispatch:
    inputs:
      candidate:
        description: The published nightly to upgrade to, by tag, such as v0.0.13-nightly.20261013.300
        type: string
        required: true
      sha:
        description: Full candidate product commit, required for focused compatibility
        type: string
        required: false
      native_case:
        description: Native telemetry coverage, all for ordinary release acceptance
        type: choice
        options:
          - all
          - compatibility
        default: all

permissions:
  contents: read

jobs:
  upgrade:
    name: Install and upgrade on Windows
    if: github.repository == 'Mr-Streamer-OSS/MrStreamer' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 90
    # One at a time, and never cancelled: a run cut short could leave its firewall rules on its
    # runner. Every request waits its turn, so one by hand never replaces a release's.
    concurrency:
      group: upgrade-check
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # The check drives the installed app; it needs no Electron of its own.
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Find and check the two installers
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
          SHA: ${{ inputs.sha }}
          NATIVE_CASE: ${{ inputs.native_case || 'all' }}
        run: |
          case "$NATIVE_CASE" in
            all) ;;
            compatibility)
              [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Focused compatibility requires a full candidate SHA'; exit 1; }
              [[ "$CANDIDATE" == v0.0.16-nightly.* ]] || { echo 'Focused compatibility requires a .16 nightly'; exit 1; }
              ;;
            *) echo 'Unknown native telemetry selection'; exit 1 ;;
          esac
          args=(--candidate "$CANDIDATE" --out "$RUNNER_TEMP/installed-upgrade-packages")
          [ -n "$SHA" ] && args+=(--sha "$SHA")
          node apps/desktop/test/e2e/installed-upgrade.ts resolve "${args[@]}"
      - name: Install, retain state and check offline copies
        run: |
          node apps/desktop/test/e2e/installed-upgrade.ts run \
            --packages "$RUNNER_TEMP/installed-upgrade-packages" --root "$RUNNER_TEMP/installed-upgrade"
      # Explicit long native acceptance stays outside the bounded release-UI aggregate.
      - name: Native telemetry and installed .15 compatibility
        if: startsWith(inputs.candidate, 'v0.0.16-nightly.')
        env:
          NATIVE_CASE: ${{ inputs.native_case || 'all' }}
          SHA: ${{ inputs.sha }}
        run: |
          args=(--native-case "$NATIVE_CASE")
          [ -n "$SHA" ] && args+=(--sha "$SHA")
          node apps/desktop/test/e2e/installed-upgrade.ts telemetry \
            --packages "$RUNNER_TEMP/installed-upgrade-packages" --root "$RUNNER_TEMP/native-telemetry" "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-telemetry/evidence/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: native-telemetry-profiles-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-telemetry/profiles/
            !${{ runner.temp }}/native-telemetry/profiles/**/Cache/
            !${{ runner.temp }}/native-telemetry/profiles/**/Code Cache/
            !${{ runner.temp }}/native-telemetry/profiles/**/GPUCache/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/installed-upgrade-packages/receipt.json
            ${{ runner.temp }}/installed-upgrade/evidence/
            ${{ runner.temp }}/installed-upgrade/profile.lock
          retention-days: 14
          if-no-files-found: warn
      # What a failure left, to look at: the fake subscription's profile, without Chromium's caches.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: installed-upgrade-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/installed-upgrade/profile/
            !${{ runner.temp }}/installed-upgrade/profile/**/Cache/
            !${{ runner.temp }}/installed-upgrade/profile/**/Code Cache/
            !${{ runner.temp }}/installed-upgrade/profile/**/GPUCache/
            !${{ runner.temp }}/installed-upgrade/profile/**/DawnGraphiteCache/
            !${{ runner.temp }}/installed-upgrade/profile/**/DawnWebGPUCache/
          retention-days: 7
          if-no-files-found: ignore
