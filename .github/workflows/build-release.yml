# Builds, checks and publishes one release, then points the update feed at it. release.yml plans
# the release and calls this, twice when a stable run publishes a nightly of main first;
# docs/maintainers/releasing.md describes the process.
#
# Every job checks out the planned commit, except the Store job, which runs main's scripts on the
# package the run built. Windows also reads its toolchain action from the workflow commit.
# Pull requests are dry runs: they build, sign and test, prepare the source archives a release
# attaches, keep the files as workflow artifacts and publish nothing, whatever the inputs say. Artifact names carry the version, so the two releases of one run never mix files.
# It has no concurrency group of its own: release.yml's queue already holds the whole run, and a
# group here that a release run's own jobs shared could leave them waiting on that run.
#
# Publishing waits for every platform, the checks and the sources. Windows packages in a job of its
# own, so the Store package starts when the Windows build is ready and not when the slowest platform
# is; the Store job waits for publishing and that package.
name: Build and publish a release

on:
  workflow_call:
    inputs:
      channel:
        description: nightly or stable
        type: string
        required: true
      version:
        type: string
        required: true
      tag:
        type: string
        required: true
      sha:
        description: The commit every job checks out
        type: string
        required: true
      previous-tag:
        description: The notes list the changes since this release. Empty for a channel's first.
        type: string
        default: ""
      feed-required:
        description: Fail the run when the update feed doesn't name the release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.sha }}
      # A stable run checks two releases, so each report takes its version.
      report-name: ${{ inputs.version }}

  # The JavaScript is the same on every platform: built once, packaged three times.
  bundle:
    name: Build JS bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm pkg set version="${{ inputs.version }}"
        working-directory: apps/desktop
      - run: pnpm build
        env:
          # The app's TMDB key, built into the main bundle; see docs/maintainers/releasing.md.
          MR_STREAMER_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
          # Optional public write-only project token and approved region. Missing setup disables
          # analytics. PR dry runs and normal CI/development builds never compile capture on.
          MR_STREAMER_ANALYTICS_PROJECT_TOKEN: ${{ github.event_name != 'pull_request' && secrets.POSTHOG_PROJECT_TOKEN || '' }}
          MR_STREAMER_ANALYTICS_HOST: ${{ vars.POSTHOG_HOST }}
          MR_STREAMER_ANALYTICS_RELEASE_BUILD: ${{ github.event_name != 'pull_request' && '1' || '0' }}
      # The receipt travels with the exact JS bytes all packages and the UI job consume.
      - name: Record release UI bundle identity
        env:
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -f scripts/release-ui.ts ]; then
            node scripts/release-ui.ts record "$SHA" "$VERSION"
          elif [[ "$VERSION" =~ ^0\.0\.([0-9]|10)(-nightly\.[0-9]{8}\.[0-9]+)?$ ]]; then
            echo "Legacy source before 0.0.11: release UI helpers are not required." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::This source requires release UI helpers."
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-bundle-${{ inputs.version }}
          path: apps/desktop/out/
          retention-days: 1
          if-no-files-found: error

  # Bounded Linux source-build proof on release dry runs only. Native installed checks below
  # keep their own acceptance. No new job in the publication graph or ordinary PR CI.
  release-ui:
    name: Release UI proof
    needs: bundle
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SHA: ${{ inputs.sha }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mrstreamer exec node node_modules/electron/install.js
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg xvfb
      - run: npm pkg set version="$VERSION"
        working-directory: apps/desktop
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-bundle-${{ inputs.version }}
          path: apps/desktop/out
      - name: Verify required release UI scenarios
        run: |
          if [ -f scripts/release-ui.ts ]; then
            xvfb-run -a node scripts/release-ui.ts run "$SHA" "$VERSION" .local/release-ui
          elif [[ "$VERSION" =~ ^0\.0\.([0-9]|10)(-nightly\.[0-9]{8}\.[0-9]+)?$ ]]; then
            mkdir -p .local/release-ui
            node --input-type=module -e '
              import { writeFileSync } from "node:fs";
              writeFileSync(".local/release-ui/legacy.json", JSON.stringify({
                status: "legacy-ineligible", revision: process.env.SHA, version: process.env.VERSION,
                reason: "Source before 0.0.11 without release UI helpers; prior promotion checks remain required."
              }, null, 2));'
            echo "Legacy source before 0.0.11 has no aggregate UI acceptance." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::This source requires release UI helpers."
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-proof-${{ inputs.version }}-${{ github.run_attempt }}
          path: .local/release-ui/
          retention-days: 14
          if-no-files-found: error

  # macOS and Linux. Windows has its own job below.
  package:
    name: Package ${{ matrix.target }}
    needs: bundle
    strategy:
      # Every platform reports its own result; the release still needs all of them.
      fail-fast: false
      matrix:
        include:
          - { target: mac-arm64, runner: macos-15, builder: --mac --arm64 }
          - { target: linux-x64, runner: ubuntu-24.04, builder: --linux --x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
    # The app, its scripts and its tests live in apps/desktop. Action paths stay relative to the
    # repository root.
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The bundled ffmpeg, rebuilt only when build-ffmpeg.sh changes.
      - id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/vendor/ffmpeg/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('apps/desktop/scripts/build-ffmpeg.sh') }}
      - name: Build ffmpeg on Linux
        # Ubuntu 22.04, so the binary also runs on older systems.
        if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/repo -w /repo ubuntu:22.04 bash -c '
            apt-get update -qq &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              build-essential nasm pkg-config git curl ca-certificates xz-utils >/dev/null &&
            scripts/build-ffmpeg.sh linux-x64 &&
            chown -R '"$(id -u):$(id -g)"' vendor'
      - name: Build ffmpeg on macOS
        if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: |
          brew install --quiet nasm pkg-config
          scripts/build-ffmpeg.sh mac-arm64
      - name: Check ffmpeg cuts segments for receivers
        # A cached build from before the segment muxer would play on no TV.
        run: |
          muxers=$(vendor/ffmpeg/${{ matrix.target }}/ffmpeg -hide_banner -muxers)
          grep -qw segment <<<"$muxers"

      # The AirPlay helper as it comes from the compiler, rebuilt only when what the script hashes
      # changes: its sources, Info.plist and flags, and the Swift compiler and SDK of this runner
      # image. Packaging signs a copy inside the app, so no release signature is ever cached.
      # This workflow runs from main on whichever commit the release names, which can be a tested
      # nightly from before the script printed a key. That source compiles every time, as it did.
      - name: Find the AirPlay helper's inputs
        id: airplay-key
        if: runner.os == 'macOS'
        # A script that names --key supports it, and then its failure stops the step. Assigned
        # first, so that failure cannot leave one empty key shared by every build.
        run: |
          if grep -q -e '--key' scripts/build-airplay-helper.sh; then
            inputs=$(scripts/build-airplay-helper.sh --key ${{ matrix.target }})
            echo "key=airplay-${{ matrix.target }}-$inputs" >> "$GITHUB_OUTPUT"
          fi
      - id: airplay
        if: runner.os == 'macOS' && steps.airplay-key.outputs.key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/vendor/airplay/${{ matrix.target }}
          key: ${{ steps.airplay-key.outputs.key }}
      - name: Build the AirPlay helper
        if: runner.os == 'macOS' && steps.airplay.outputs.cache-hit != 'true'
        run: scripts/build-airplay-helper.sh mac-arm64

      - run: npm pkg set version="$VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-bundle-${{ inputs.version }}
          path: apps/desktop/out

      # The build and the disk image's notarization print their phases, which the last command
      # times: the runner's own work apart from the waits on Apple, in the job summary. A commit
      # from before that command existed is built and notarized the same way, untimed.
      - name: Build for macOS, signed and notarized
        if: runner.os == 'macOS'
        env:
          DEBUG: electron-notarize*
          # Dry runs happen on this repository's own labelled pull requests, so they sign too.
          CSC_FOR_PULL_REQUEST: "true"
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || { echo "::error::The $name secret is missing; see docs/maintainers/signing.md"; exit 1; }
          done
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          build() {
            pnpm exec electron-builder ${{ matrix.builder }} --publish never
            node scripts/notarize-dmg.ts dist/*.dmg
          }
          if [ -f scripts/mac-release-phases.ts ]; then
            build 2>&1 | node scripts/mac-release-phases.ts "Mac release phases, $VERSION from ${SHA::12}"
          else
            build
          fi
          rm -f "$APPLE_API_KEY"

      - name: Check the macOS signature
        if: runner.os == 'macOS'
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          app="dist/mac-arm64/Mr. Streamer.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -qx "TeamIdentifier=$TEAM_ID"
          codesign -dv "$app" 2>&1 | grep -q "flags=0x10000(runtime)"
          spctl --assess --type execute --verbose "$app"
          spctl --assess --type open --context context:primary-signature --verbose dist/*.dmg
          if [ -f scripts/stapler-ticket.ts ]; then
            node scripts/stapler-ticket.ts validate "$app"
            node scripts/stapler-ticket.ts validate dist/*.dmg
          else
            xcrun stapler validate "$app"
            xcrun stapler validate dist/*.dmg
          fi

      - name: Check the AirPlay helper starts
        if: runner.os == 'macOS'
        # Signed and under the hardened runtime, as it ships. With nothing to read it says hello
        # and exits.
        run: |
          said=$("dist/mac-arm64/Mr. Streamer.app/Contents/Resources/airplay/MrStreamerAirPlay" </dev/null)
          grep -q '"type":"hello"' <<<"$said"

      - name: Build for Linux
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder ${{ matrix.builder }} --publish never

      - name: Check the update metadata
        run: |
          for file in dist/latest*.yml; do
            grep -qx "version: $VERSION" "$file" || { echo "::error::$file does not name $VERSION"; exit 1; }
          done

      - name: Smoke test the installed app on macOS
        if: runner.os == 'macOS'
        run: |
          mount=$(hdiutil attach -nobrowse -readonly dist/*.dmg | tail -1 | cut -f3)
          ditto "$mount/Mr. Streamer.app" "/Applications/Mr. Streamer.app"
          hdiutil detach "$mount"
          node test/e2e/packaged-app.ts "/Applications/Mr. Streamer.app/Contents/MacOS/Mr. Streamer" -- --use-mock-keychain

      - name: Smoke test the installed app on Linux
        if: runner.os == 'Linux'
        run: |
          # AppImages need FUSE 2, as on a user's Ubuntu.
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libfuse2t64 ./dist/*.deb
          xvfb-run -a node test/e2e/packaged-app.ts "/opt/Mr. Streamer/mrstreamer" -- --no-sandbox
          xvfb-run -a node test/e2e/packaged-app.ts dist/*.AppImage -- --no-sandbox

      - id: package-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}-${{ inputs.version }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          # Dry runs keep their files for testing; a release keeps them on GitHub Releases.
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 3 }}
          if-no-files-found: error

      # Receipt tooling belongs to the workflow commit, even when stable rebuilds older source.
      # These non-product scripts load only after native checks and package upload succeed.
      - name: Write successful package receipt
        shell: bash
        env:
          PACKAGE_SOURCE: ${{ inputs.sha }}
          PACKAGE_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          PACKAGE_APP_VERSION: ${{ inputs.version }}
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.target }}
          PACKAGE_DISTRIBUTION: direct
          PACKAGE_RUN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PACKAGE_ARTIFACT_ID: ${{ steps.package-artifact.outputs.artifact-id }}
          PACKAGE_ARTIFACT_NAME: release-${{ matrix.target }}-${{ inputs.version }}
          PACKAGE_ARTIFACT_SHA256: ${{ steps.package-artifact.outputs.artifact-digest }}
        run: |
          git fetch --no-tags --depth=1 origin "$PACKAGE_WORKFLOW_COMMIT"
          git show "$PACKAGE_WORKFLOW_COMMIT:apps/desktop/scripts/package-receipt.ts" > scripts/package-receipt.ts
          node scripts/package-receipt.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-receipt-${{ matrix.target }}-direct-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: apps/desktop/package-receipt.json
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 3 }}
          if-no-files-found: error

  # The Windows installer, in a job of its own: the Store package needs the ffmpeg this job caches,
  # and waits for it and for no other platform.
  package-windows:
    name: Package win-x64
    needs: bundle
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      # The cache the msix job restores. It exists once this job has succeeded, built or found.
      ffmpeg-key: ${{ steps.ffmpeg-key.outputs.key }}
    env:
      VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Keep setup with this workflow even when stable promotes source predating the action.
      # All callers use local reusable workflows, from the caller's workflow commit.
      - name: Read the Windows FFmpeg toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ffmpeg-toolchain
          sparse-checkout: apps/desktop/scripts/windows-ffmpeg-toolchain
          persist-credentials: false

      # Hash the actual setup definition and the release source's pinned sources/build flags.
      # No restore prefix: a UCRT64 build must never restore an old MINGW64 binary.
      - id: ffmpeg-key
        run: |
          test -f ../../.ffmpeg-toolchain/apps/desktop/scripts/windows-ffmpeg-toolchain/action.yml
          test -f scripts/build-ffmpeg.sh
          echo "key=ffmpeg-win-x64-ucrt64-${{ hashFiles('.ffmpeg-toolchain/apps/desktop/scripts/windows-ffmpeg-toolchain/action.yml', 'apps/desktop/scripts/build-ffmpeg.sh') }}" >> "$GITHUB_OUTPUT"
      - id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/vendor/ffmpeg/win-x64
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: ./.ffmpeg-toolchain/apps/desktop/scripts/windows-ffmpeg-toolchain
      - name: Build ffmpeg on Windows
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: scripts/build-ffmpeg.sh win-x64
      - name: Check and record Windows ffmpeg provenance
        # README.txt is cached with both binaries, including on a warm-cache run.
        run: |
          # Stable can rebuild a tested nightly from before the script recorded UCRT64.
          if grep -q 'MSYS2 UCRT64' scripts/build-ffmpeg.sh; then
            grep -q 'C runtime UCRT; MSYS2 UCRT64; packages ' vendor/ffmpeg/win-x64/README.txt
            grep -q 'mingw-w64-ucrt-x86_64-gcc ' vendor/ffmpeg/win-x64/README.txt
          fi
          cat vendor/ffmpeg/win-x64/README.txt
      - name: Check ffmpeg cuts segments for receivers
        # A cached build from before the segment muxer would play on no TV.
        run: |
          muxers=$(vendor/ffmpeg/win-x64/ffmpeg -hide_banner -muxers)
          grep -qw segment <<<"$muxers"

      - run: npm pkg set version="$VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-bundle-${{ inputs.version }}
          path: apps/desktop/out

      # Windows installers are unsigned for now. Signing belongs here, as its own step with its
      # own secrets, without touching the Mac certificate; docs/maintainers/signing.md.
      - name: Build for Windows
        run: pnpm exec electron-builder --win --x64 --publish never

      # About has a notice for each plug-in NSIS puts in the setup and its uninstaller, and the
      # release attaches their sources. A plug-in added or changed since they were reviewed stops
      # the build here; docs/maintainers/licences.md#windows-setup-program.
      - name: Check the setup's plug-ins
        run: node scripts/installer-plugins.ts dist/*-setup.exe

      - name: Check the update metadata
        run: |
          for file in dist/latest*.yml; do
            grep -qx "version: $VERSION" "$file" || { echo "::error::$file does not name $VERSION"; exit 1; }
          done

      - name: Smoke test the installed app on Windows
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          node test/e2e/packaged-app.ts "$env:LOCALAPPDATA\Programs\mrstreamer\Mr. Streamer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - id: package-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-win-x64-${{ inputs.version }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          # Dry runs keep their files for testing; a release keeps them on GitHub Releases.
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 3 }}
          if-no-files-found: error

      # Receipt tooling belongs to the workflow commit, even when stable rebuilds older source.
      # These non-product scripts load only after native checks and package upload succeed.
      - name: Write successful package receipt
        shell: bash
        env:
          PACKAGE_SOURCE: ${{ inputs.sha }}
          PACKAGE_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          PACKAGE_APP_VERSION: ${{ inputs.version }}
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: win-x64
          PACKAGE_DISTRIBUTION: direct
          PACKAGE_RUN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PACKAGE_ARTIFACT_ID: ${{ steps.package-artifact.outputs.artifact-id }}
          PACKAGE_ARTIFACT_NAME: release-win-x64-${{ inputs.version }}
          PACKAGE_ARTIFACT_SHA256: ${{ steps.package-artifact.outputs.artifact-digest }}
        run: |
          git fetch --no-tags --depth=1 origin "$PACKAGE_WORKFLOW_COMMIT"
          git show "$PACKAGE_WORKFLOW_COMMIT:apps/desktop/scripts/package-receipt.ts" > scripts/package-receipt.ts
          node scripts/package-receipt.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-receipt-win-x64-direct-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: apps/desktop/package-receipt.json
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 3 }}
          if-no-files-found: error

  # The Microsoft Store package, an MSIX of the same app, for dry runs and stable releases: only
  # stable releases go to the Store. It waits for the Windows installer and no other platform, and
  # publishing doesn't wait for it, so it can't hold up a release. Its file stays a workflow
  # artifact, apart from the release-* artifacts publish attaches: never on the release or in the
  # update feed. The store job below sends a stable release's to the Store. The JS bundle it takes
  # is there once the Windows installer is built, which took it too.
  msix:
    name: Package Microsoft Store MSIX
    needs: package-windows
    if: github.event_name == 'pull_request' || inputs.channel == 'stable'
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      # The package's checksum, which the store job compares with the file it downloads.
      sha256: ${{ steps.check.outputs.sha256 }}
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/vendor/ffmpeg/win-x64
          key: ${{ needs.package-windows.outputs.ffmpeg-key }}
          fail-on-cache-miss: true
      - run: npm pkg set version="$env:VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-bundle-${{ inputs.version }}
          path: apps/desktop/out
      - name: Build the MSIX
        run: pnpm exec electron-builder --win appx --x64 --publish never

      # Partner Center's identity exactly, a name it reserved, the Store version for this release,
      # and what the app needs at run time: ffmpeg, ffprobe and the notices Settings > About reads.
      # The record it writes beside the package ties the file to the release and its commit by
      # checksum.
      #
      # This workflow is main's, and the checkout is the release's commit, which for a stable
      # release is a nightly tested earlier. scripts/msix-version.ts exports packageVersion in
      # every one of them, so the check imports it from there and nowhere newer. A commit from
      # before the Store name builds a package named "Mr. Streamer", which stays reserved: it
      # passes, and its submission leaves the listing's title alone.
      - name: Check the package
        id: check
        run: |
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          & $makeappx.FullName unpack /p "dist/Mr-Streamer-$env:VERSION-win-x64.msix" /d "$env:RUNNER_TEMP\msix" /o | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$manifest = Get-Content "$env:RUNNER_TEMP\msix\AppxManifest.xml"
          $version = node --input-type=module -e 'import { packageVersion } from "./scripts/msix-version.ts"; console.log(packageVersion(process.argv[1]))' $env:VERSION
          $name = $manifest.Package.Properties.DisplayName
          $reserved = if ($name -ceq "Mr. Streamer") { $name } else { "Mr. Streamer: IPTV Player" }
          $checks = @(
            @("Identity name", $manifest.Package.Identity.Name, "MrStreamerOSS.Mr.Streamer"),
            @("Publisher", $manifest.Package.Identity.Publisher, "CN=A132E842-C4C9-40BF-83C4-D304E7952C2D"),
            @("Publisher display name", $manifest.Package.Properties.PublisherDisplayName, "Mr Streamer OSS"),
            @("Display name", $name, $reserved),
            @("Start menu name", $manifest.Package.Applications.Application.VisualElements.DisplayName, $name),
            @("Application id", $manifest.Package.Applications.Application.Id, "MrStreamer"),
            @("Architecture", $manifest.Package.Identity.ProcessorArchitecture, "x64"),
            @("Version", $manifest.Package.Identity.Version, $version)
          )
          foreach ($check in $checks) {
            if ($check[1] -cne $check[2]) { echo "::error::$($check[0]) is '$($check[1])', not '$($check[2])'."; exit 1 }
          }
          foreach ($file in "Mr. Streamer.exe", "resources\app.asar", "resources\ffmpeg\ffmpeg.exe",
              "resources\ffmpeg\ffprobe.exe", "LICENSES.chromium.html", "LICENSE.electron.txt") {
            if (-not (Test-Path -LiteralPath "$env:RUNNER_TEMP\msix\app\$file")) { echo "::error::The package has no $file."; exit 1 }
          }
          $hash = (Get-FileHash "dist/Mr-Streamer-$env:VERSION-win-x64.msix" -Algorithm SHA256).Hash.ToLower()
          [ordered]@{ version = $env:VERSION; packageVersion = $version; commit = $env:SHA; sha256 = $hash } |
            ConvertTo-Json | Set-Content "dist/Mr-Streamer-$env:VERSION-win-x64.msix.json"
          Add-Content $env:GITHUB_OUTPUT "sha256=$hash"
          Add-Content $env:GITHUB_OUTPUT "package-version=$version"
          Add-Content $env:GITHUB_STEP_SUMMARY "Mr. Streamer $env:VERSION is package $version, named '$name', built from $env:SHA. SHA-256 $hash."

      # Windows installs only signed packages. A certificate made here, with the package's
      # publisher as its subject and trusted on this runner alone, signs a copy to install; the
      # artifact stays unsigned for the Store to sign. Installing proves nothing about Store trust;
      # docs/maintainers/signing.md#microsoft-store-package.
      - name: Install a test-signed copy
        run: |
          [xml]$manifest = Get-Content "$env:RUNNER_TEMP\msix\AppxManifest.xml"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $manifest.Package.Identity.Publisher `
            -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\test.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          Copy-Item "dist/Mr-Streamer-$env:VERSION-win-x64.msix" "$env:RUNNER_TEMP\test.msix"
          & $signtool.FullName sign /q /fd SHA256 /sha1 $cert.Thumbprint "$env:RUNNER_TEMP\test.msix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-AppxPackage "$env:RUNNER_TEMP\test.msix"
          # Windows derives the family name from the identity: it must be the one Partner Center gave.
          $family = (Get-AppxPackage MrStreamerOSS.Mr.Streamer).PackageFamilyName
          if ($family -cne "MrStreamerOSS.Mr.Streamer_5yzg1erdm3xmr") { echo "::error::Installed as $family."; exit 1 }

      # Started by its path, the app runs with the package's identity, as it does from Start, so
      # the test also expects it to leave updates to the Store.
      - name: Smoke test the installed package
        run: |
          $package = Get-AppxPackage MrStreamerOSS.Mr.Streamer
          node test/e2e/packaged-app.ts (Join-Path $package.InstallLocation "app\Mr. Streamer.exe")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Started as a user would, a Store copy keeps its data in a folder of its own inside the
      # package's, apart from a direct copy's; docs/contributing/architecture.md#data.
      - name: Check where the Store copy keeps its data
        run: |
          $package = Get-AppxPackage MrStreamerOSS.Mr.Streamer
          Start-Process -FilePath (Join-Path $package.InstallLocation "app\Mr. Streamer.exe")
          Start-Sleep 15
          Get-Process "Mr. Streamer" -ErrorAction SilentlyContinue | Stop-Process -Force
          $own = "$env:LOCALAPPDATA\Packages\$($package.PackageFamilyName)\LocalCache\Roaming\Mr. Streamer Store"
          if (-not (Test-Path "$own\Local State")) { echo "::error::Nothing in $own."; exit 1 }
          if (Test-Path "$env:APPDATA\Mr. Streamer Store") { echo "::error::The Store copy wrote to the real AppData."; exit 1 }

      # The kit's report goes with the package. Its optional "Blocked executables" test fails: it
      # flags strings such as "cmd" and "reg" inside Electron's and ffmpeg's files. The overall
      # result has to pass.
      - name: Windows App Certification Kit
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          # The kit takes only a full path for its report.
          $report = Join-Path (Resolve-Path dist) "Mr-Streamer-$env:VERSION-win-x64.wack.xml"
          & $appcert reset | Out-Null
          & $appcert test -appxpackagepath "$env:RUNNER_TEMP\test.msix" -reportoutputpath $report
          [xml]$xml = Get-Content $report
          foreach ($test in $xml.SelectNodes("//TEST[RESULT != 'PASS']")) {
            $optional = if ($test.OPTIONAL -eq "TRUE") { " (optional)" } else { "" }
            echo "$($test.SelectSingleNode('RESULT').InnerText) $($test.NAME)$optional"
          }
          $overall = $xml.REPORT.OVERALL_RESULT
          Add-Content $env:GITHUB_STEP_SUMMARY "Windows App Certification Kit: $overall"
          if ($overall -ne "PASS") { echo "::error::The certification kit's result is $overall."; exit 1 }

      # Uninstalling removes what the package wrote to AppData along with it.
      - name: Uninstall
        run: |
          $package = Get-AppxPackage MrStreamerOSS.Mr.Streamer
          Remove-AppxPackage $package.PackageFullName
          if (Test-Path "$env:LOCALAPPDATA\Packages\$($package.PackageFamilyName)") {
            echo "::error::Uninstalling left the package's data behind."
            exit 1
          }

      # Only a package that passed every step above gets this name, which is the one the Store
      # job and a submission by hand take it under.
      - id: package-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msix-${{ inputs.version }}
          path: |
            apps/desktop/dist/*.msix
            apps/desktop/dist/*.msix.json
            apps/desktop/dist/*.wack.xml
          # A release's package is the one the Store gets, at once or in a later run, so it's
          # kept longer.
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
          if-no-files-found: error

      # Receipt tooling belongs to the workflow commit, even when stable rebuilds older source.
      # These non-product scripts load only after native checks and package upload succeed.
      - name: Write successful package receipt
        shell: bash
        env:
          PACKAGE_SOURCE: ${{ inputs.sha }}
          PACKAGE_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          PACKAGE_APP_VERSION: ${{ inputs.version }}
          PACKAGE_VERSION: ${{ steps.check.outputs.package-version }}
          PACKAGE_PLATFORM: win-x64
          PACKAGE_DISTRIBUTION: store
          PACKAGE_RUN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PACKAGE_ARTIFACT_ID: ${{ steps.package-artifact.outputs.artifact-id }}
          PACKAGE_ARTIFACT_NAME: msix-${{ inputs.version }}
          PACKAGE_ARTIFACT_SHA256: ${{ steps.package-artifact.outputs.artifact-digest }}
        run: |
          git fetch --no-tags --depth=1 origin "$PACKAGE_WORKFLOW_COMMIT"
          git show "$PACKAGE_WORKFLOW_COMMIT:apps/desktop/scripts/package-receipt.ts" > scripts/package-receipt.ts
          node scripts/package-receipt.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-receipt-win-x64-store-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: apps/desktop/package-receipt.json
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
          if-no-files-found: error
      # What a failed check left, to look at. Never submitted.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: msix-failed-${{ inputs.version }}
          path: |
            apps/desktop/dist/*.msix
            apps/desktop/dist/*.msix.json
            apps/desktop/dist/*.wack.xml
          retention-days: 14

  # The source archives the installers' licences ask for, which every release attaches: FFmpeg and
  # x264, Chromium's FFmpeg and Electron, and the Windows setup's plug-ins. Each is checked against
  # its pinned SHA-256 or commit, and the notices built into the app have to link exactly these
  # files; docs/maintainers/licences.md#sources-on-every-release. Dry runs prepare and check them
  # too, so a missing or changed source shows before a release needs it. As a release-* artifact,
  # the archives reach publish with the installers.
  sources:
    name: Prepare sources
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      files: ${{ steps.prepare.outputs.files }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The notices link the sources on the release of this version.
      - run: npm pkg set version="${{ inputs.version }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-bundle-${{ inputs.version }}
          path: apps/desktop/out
      - id: prepare
        run: node scripts/release-sources.ts "$RUNNER_TEMP/sources"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sources-${{ inputs.version }}
          path: ${{ runner.temp }}/sources/
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 3 }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [checks, package, package-windows, sources]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # The notes list the pull requests behind each commit.
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      SHA: ${{ inputs.sha }}
      PREVIOUS_TAG: ${{ inputs.previous-tag }}
      # The archives the sources job prepared, by name.
      SOURCES: ${{ needs.sources.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The installers of every platform, and the sources that go with them.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-${{ inputs.version }}
          path: release
          merge-multiple: true
      - name: Check every platform's files and every source are here
        run: |
          [ -n "$SOURCES" ] || { echo "::error::The sources job named no source archives."; exit 1; }
          for pattern in "Mr-Streamer-$VERSION-mac-arm64.dmg" "Mr-Streamer-$VERSION-mac-arm64.zip" latest-mac.yml \
            "Mr-Streamer-$VERSION-win-x64-setup.exe" latest.yml \
            "Mr-Streamer-$VERSION-linux-*.AppImage" "Mr-Streamer-$VERSION-linux-*.deb" latest-linux.yml $SOURCES; do
            compgen -G "release/$pattern" >/dev/null || { echo "::error::No $pattern among the release's files."; exit 1; }
          done
      - name: Write checksums and notes
        run: |
          (cd release && sha256sum * > SHA256SUMS.txt)
          {
            echo "**${CHANNEL^}** · built from \`${SHA::12}\`"
            echo
            echo "Download the DMG on Mac, the setup .exe on Windows, and the AppImage or .deb on Linux. SHA256SUMS.txt lists every file's checksum."
            echo
            node scripts/release-plan.ts notes --tag "$TAG" --sha "$SHA" --previous-tag "$PREVIOUS_TAG"
          } > notes.md
      # A failed or repeated attempt can leave a draft with this tag. Users never saw it.
      - name: Remove an unfinished attempt
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
      - name: Check the version is still new
        run: node scripts/release-plan.ts check --version "$VERSION"
      # Uploads into a draft, which the app can't see, and publishes once every file is in.
      - name: Publish
        run: |
          nightly=$([ "$CHANNEL" = nightly ] && echo true || echo false)
          gh release create "$TAG" release/* --draft --prerelease="$nightly" --target "$SHA" \
            --title "Mr. Streamer $VERSION" --notes-file notes.md
          if [ "$nightly" = true ]; then
            gh release edit "$TAG" --draft=false --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi

  # Sends the stable release's package to the Microsoft Store, once the release is published and
  # the package passed its checks: only for a stable release started by hand from main, never for
  # a nightly, a dry run, a push or a tag. The release is out by then, and feed and finalize don't
  # wait for this job, so a failure here shows on the run without holding up or undoing anything.
  # It waits for Microsoft to take the upload, a few minutes, and not for certification, which can
  # take days. Until the owner turns submissions on it says so and sends nothing;
  # docs/maintainers/microsoft-store.md.
  store:
    name: Microsoft Store
    needs: [publish, msix]
    if: >-
      inputs.channel == 'stable' && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/microsoft-store.yml
    with:
      version: ${{ inputs.version }}
      sha: ${{ inputs.sha }}
      sha256: ${{ needs.msix.outputs.sha256 }}
    # The called job reads its credential from the microsoft-store environment.
    secrets: inherit
    permissions:
      contents: read
      actions: read

  # Points the app's update feed at the release. A job that calls a workflow can't take
  # continue-on-error, so the input sets it on the called job: the release is out by now, and a
  # failure there, such as before Pages is enabled, shows on that job without failing the run.
  # A nightly that goes before a stable release is the exception: its failure stops the run, so
  # the stable release waits until the feed names the nightly.
  feed:
    name: Update feed
    needs: publish
    uses: ./.github/workflows/update-feed.yml
    with:
      release: ${{ inputs.version }}
      continue-on-error: ${{ !inputs.feed-required }}
    permissions:
      contents: read
      pages: write
      id-token: write

  finalize:
    # marketing-deploy.yml reads this job name to confirm a published stable release.
    # Update its trigger query too if this name changes.
    name: Record the stable version on main
    needs: publish
    if: inputs.channel == 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Main may move while this runs: start again from its newest commit when a push is refused.
      - name: Commit the version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q --depth 1 origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD
            node scripts/release-plan.ts record --version "$VERSION"
            git diff --quiet && exit 0
            git commit -qam "chore(release): prepare v$VERSION"
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          echo "::error::Main kept moving; run this job again."
          exit 1
