# Publishes the website, apps/marketing, to mrstreamer.app on Vercel: after a push to main that
# changes site inputs, after a recorded stable promotion, or by hand from main. README.md has the
# setup, the first publication and how to turn it off.
#
# Off until the repository variable MARKETING_DEPLOY_ENABLED is "true": until then a run builds,
# says that publishing is off, and stops. Turned on, it needs the marketing-production
# environment, limited to main, with the secret VERCEL_TOKEN and the variables VERCEL_ORG_ID and
# VERCEL_PROJECT_ID.
#
# - Only main publishes: no pull request event starts this workflow, so no fork's code runs near
#   the token.
# - The build job has no owner secrets. A read-only workflow token fetches release history, and
#   website analytics take the PostHog host and public project key from repository variables,
#   as the page carries that key anyway. It builds main as it is when the job starts, checks the package
#   (apps/marketing/scripts/package-vercel.ts) and hands over only .vercel/output.
# - The publish job checks out nothing: it holds that package and the token, and runs the pinned
#   Vercel CLI on it.
# - One publication at a time. A run that waited builds the newest main. Before it publishes, a
#   run asks git whether main has changed the website since its build, and if so leaves
#   publishing to the run that change started.
#
# The Vercel project has no Git connection and an empty Root Directory: Vercel builds nothing
# itself, and this workflow is the only thing that publishes.
name: Marketing deploy

on:
  push:
    branches: [main]
    # What the page is built from. MARKETING_INPUTS below names the same files for git.
    paths:
      - apps/marketing/**
      - docs/assets/**
      - docs/privacy.md
      - docs/about.md
      - docs/security.md
      - docs/user/**
      - packages/contracts/src/update-feed.ts
      - packages/contracts/src/version.ts
      - apps/desktop/assets/brand/mark.svg
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/marketing.yml
      - .github/workflows/marketing-deploy.yml
  workflow_dispatch:
  # GITHUB_TOKEN release publications do not start a release event workflow. A completed run
  # does start workflow_run; the gate below admits only a recorded stable promotion on main.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

# Runs from main take turns without replacing pending publications, as release.yml does.
# Nightly workflow_run events can reach this queue before the trigger gate rejects them.
# Non-main manual runs get a group of their own and cannot delay a main publication.
concurrency:
  group: marketing-production-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  MARKETING_INPUTS: >-
    apps/marketing docs/assets docs/privacy.md docs/about.md docs/security.md docs/user apps/desktop/assets/brand/mark.svg package.json pnpm-workspace.yaml
    pnpm-lock.yaml .github/workflows/marketing.yml .github/workflows/marketing-deploy.yml
    packages/contracts/src/update-feed.ts packages/contracts/src/version.ts

jobs:
  trigger:
    name: Check publication trigger
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.trigger.outputs.allowed }}
    steps:
      # No checkout or artifacts from the triggering workflow. GitHub's job records prove the
      # stable-only recording job succeeded; nightly runs and dry runs never pass this gate.
      # A later Store upload failure does not undo the release or block this rebuild.
      - id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_run ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            stable=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RELEASE_RUN/jobs?per_page=100" \
              --jq '.jobs[] | select(.name | endswith("Record the stable version on main")) | select(.conclusion == "success") | .id')
            if [ -n "$stable" ]; then
              echo "allowed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    name: Build and check
    needs: trigger
    # A run started by hand from another branch does nothing.
    if: github.ref == 'refs/heads/main' && needs.trigger.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      # main as it is now, which a run that waited its turn finds newer than the push behind it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Note the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter mrstreamer-marketing...
      - name: Build and check the package
        env:
          GH_TOKEN: ${{ github.token }}
          # Website analytics: on only with PostHog's EU host and the public phc_ project key.
          # Missing or other values build a site that sends nothing (scripts/site-analytics.ts).
          MR_STREAMER_SITE_ANALYTICS_RELEASE_BUILD: "1"
          MR_STREAMER_SITE_ANALYTICS_HOST: ${{ vars.POSTHOG_HOST }}
          MR_STREAMER_SITE_ANALYTICS_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: pnpm --filter mrstreamer-marketing build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-output
          path: apps/marketing/.vercel/output/
          # The package sits in a folder whose name starts with a dot.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      # Dependency-free notifier from the same checked build, never executed beside owner secrets.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-indexnow
          path: apps/marketing/scripts/indexnow.ts
          retention-days: 1
          if-no-files-found: error
      - name: Say that publishing is off
        if: vars.MARKETING_DEPLOY_ENABLED != 'true'
        run: |
          {
            echo "### Not published"
            echo "The website built, and publishing is off: the repository variable \`MARKETING_DEPLOY_ENABLED\` isn't \`true\`."
            echo "\`apps/marketing/README.md\` lists what to set up first."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: build
    if: vars.MARKETING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      deployed: ${{ steps.deployment.outputs.deployed }}
    environment:
      name: marketing-production
      url: https://mrstreamer.app
    steps:
      - name: Check the setup
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=("the secret VERCEL_TOKEN")
          [ -n "$VERCEL_ORG_ID" ] || missing+=("the variable VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("the variable VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            printf -v list '%s, ' "${missing[@]}"
            echo "::error::The marketing-production environment lacks ${list%, }."
            exit 1
          fi
      # git compares the whole of both commits. GitHub's comparison names 300 changed files at
      # most, so a website change behind a larger one would get past it and the older page would
      # be published over the newer. The copy of main holds its history and no files, so there is
      # still nothing from the repository here to run. A comparison that fails publishes nothing.
      - name: Leave it to a newer run when main changed the website since the build
        id: newest
        env:
          BUILT: ${{ needs.build.outputs.commit }}
        run: |
          git clone --quiet --bare --filter=blob:none --single-branch --branch main \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/main.git"
          read -ra inputs <<<"$MARKETING_INPUTS"
          changed=0
          git --git-dir="$RUNNER_TEMP/main.git" diff --quiet --no-renames "$BUILT" main -- "${inputs[@]}" || changed=$?
          if [ "$changed" -eq 1 ]; then
            echo "::notice::main changed the website after $BUILT was built. The run for that change publishes it."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          elif [ "$changed" -ne 0 ]; then
            echo "::error::Couldn't compare $BUILT with main, so this run publishes nothing."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.newest.outputs.superseded != 'true'
        with:
          name: marketing-output
          path: apps/marketing/.vercel/output
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.newest.outputs.superseded != 'true'
        with:
          node-version: 24
      # The project and account come from VERCEL_PROJECT_ID and VERCEL_ORG_ID. --prebuilt uploads
      # the package as it is, and Vercel runs nothing from the repository. --archive=tgz sends it
      # as one file. Only this step and the check hold the token.
      - name: Publish
        id: deployment
        if: steps.newest.outputs.superseded != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          BUILT: ${{ needs.build.outputs.commit }}
        run: |
          url=$(npx --yes vercel@62.2.0 deploy --prebuilt --archive=tgz --prod --cwd apps/marketing --token "$VERCEL_TOKEN")
          {
            echo "### Deployed"
            echo "$BUILT is a production deployment at $url."
            echo "Vercel points the project's domains at it, unless the project is rolled back: then they stay on the earlier deployment until Undo Rollback."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  indexnow:
    name: Notify IndexNow after publication
    needs: [build, publish]
    if: >-
      success() && github.ref == 'refs/heads/main' &&
      vars.MARKETING_DEPLOY_ENABLED == 'true' &&
      needs.publish.result == 'success' && needs.publish.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marketing-output
          path: marketing-output
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marketing-indexnow
          path: marketing-indexnow
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify the public build and notify
        env:
          BUILT: ${{ needs.build.outputs.commit }}
        run: node marketing-indexnow/indexnow.ts marketing-output/static "$BUILT"
      - name: Report notification job failure
        if: failure()
        run: |
          echo "::error::The website is already deployed. IndexNow notification failed; inspect this job before rerunning."
          echo "The website is already deployed. IndexNow notification failed; no rollback was performed." >> "$GITHUB_STEP_SUMMARY"
