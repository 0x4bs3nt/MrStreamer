# Builds and checks one release's files on every platform; release.yml calls it once for each
# release a run makes, and docs/maintainers/releasing.md describes what each job checks. It
# publishes nothing: publish.yml takes the release-* artifacts it leaves.
#
# The jobs that build check out the release's commit, which for a stable release is a nightly
# tested earlier and can be older than this workflow. The tools that set up and judge a build come
# from the workflow commit, in .workflow: the setup action, the Windows ffmpeg toolchain and the
# Store package check. The product's own scripts, its build, its tests and its package receipts
# come from the release's commit.
#
# A dry run builds, signs and tests like a release, also proves the release UI and builds the
# Store package, and keeps every file 14 days. Artifact names carry the version, so the two
# releases of a stable run never mix files. It has no concurrency group of its own:
# release.yml's queue already holds the whole run.
name: Package

on:
  workflow_call:
    inputs:
      channel:
        description: nightly or stable
        type: string
        required: true
      version:
        type: string
        required: true
      sha:
        description: The commit every job checks out
        type: string
        required: true
      dry-run:
        description: Keep the files for testing, prove the release UI and build the Store package
        type: boolean
        required: true
    outputs:
      sources:
        description: The source archives the release attaches, by name
        value: ${{ jobs.sources.outputs.files }}
      msix-sha256:
        description: The Store package's checksum. Empty unless a stable release built one that passed.
        value: ${{ jobs.msix.outputs.sha256 }}

permissions:
  contents: read

env:
  # Dry runs keep their files for testing; a release keeps them on GitHub Releases.
  KEEP_DAYS: ${{ inputs.dry-run && 14 || 3 }}

jobs:
  # CI's checks and tests on the release's commit. The bundle job below is its build.
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      sha: ${{ inputs.sha }}
      # A stable run checks two releases, so each report takes its version.
      report-name: ${{ inputs.version }}

  # The JavaScript is the same on every platform: built once, packaged three times.
  bundle:
    name: Build JS bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.workflow/.github/actions/setup
        with:
          version: ${{ inputs.version }}
          bundle: "false"
      - run: pnpm build
        env:
          # The app's TMDB key, built into the main bundle; see docs/maintainers/releasing.md.
          MR_STREAMER_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
          # Optional public write-only project token and approved region. Missing setup disables
          # analytics. Dry runs and normal CI/development builds never compile capture on.
          MR_STREAMER_ANALYTICS_PROJECT_TOKEN: ${{ !inputs.dry-run && secrets.POSTHOG_PROJECT_TOKEN || '' }}
          MR_STREAMER_ANALYTICS_HOST: ${{ vars.POSTHOG_HOST }}
          MR_STREAMER_ANALYTICS_RELEASE_BUILD: ${{ !inputs.dry-run && '1' || '0' }}
      # The receipt travels with the exact JS bytes all packages and the UI job consume.
      - name: Record release UI bundle identity
        env:
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: node scripts/release-ui.ts record "$SHA" "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-bundle-${{ inputs.version }}
          path: apps/desktop/out/
          retention-days: 1
          if-no-files-found: error

  # Bounded Linux source-build proof on dry runs only. The installed checks below keep their own
  # acceptance.
  release-ui:
    name: Release UI proof
    needs: bundle
    if: inputs.dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SHA: ${{ inputs.sha }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.workflow/.github/actions/setup
        with:
          version: ${{ inputs.version }}
      - run: pnpm --filter mrstreamer exec node node_modules/electron/install.js
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg xvfb
      - name: Verify required release UI scenarios
        run: xvfb-run -a node scripts/release-ui.ts run "$SHA" "$VERSION" .local/release-ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-proof-${{ inputs.version }}-${{ github.run_attempt }}
          path: .local/release-ui/
          retention-days: 14
          if-no-files-found: error

  # macOS and Linux. Windows has its own job below.
  package:
    name: Package ${{ matrix.target }}
    needs: bundle
    strategy:
      # Every platform reports its own result; the release still needs all of them.
      fail-fast: false
      matrix:
        include:
          - { target: mac-arm64, runner: macos-15, builder: --mac --arm64 }
          - { target: linux-x64, runner: ubuntu-24.04, builder: --linux --x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
    # The app, its scripts and its tests live in apps/desktop. Action paths stay relative to the
    # repository root.
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.workflow/.github/actions/setup
        with:
          version: ${{ inputs.version }}

      # The bundled ffmpeg, rebuilt only when build-ffmpeg.sh changes.
      - id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/vendor/ffmpeg/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('apps/desktop/scripts/build-ffmpeg.sh') }}
      - name: Build ffmpeg on Linux
        # Ubuntu 22.04, so the binary also runs on older systems.
        if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/repo -w /repo ubuntu:22.04 bash -c '
            apt-get update -qq &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              build-essential nasm pkg-config meson ninja-build git curl ca-certificates xz-utils >/dev/null &&
            scripts/build-ffmpeg.sh linux-x64 &&
            chown -R '"$(id -u):$(id -g)"' vendor'
      - name: Build ffmpeg on macOS
        if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: |
          brew install --quiet nasm pkg-config meson ninja
          scripts/build-ffmpeg.sh mac-arm64
      - name: Check bundled media features and decode fixtures
        # Check cached binaries too; a flag in the build script is not proof of decoding.
        run: |
          if [[ -f scripts/verify-ffmpeg.ts ]]; then
            node scripts/verify-ffmpeg.ts ${{ matrix.target }} > "$RUNNER_TEMP/ffmpeg-codecs.json"
          else
            # An older nightly keeps its original segment check. Modern sources must have the
            # full decoder proof; promoting an older source as 0.0.16 cannot bypass it.
            node -e 'if (!/^0[.]0[.]([0-9]|1[0-5])(-|$)/.test(require("./package.json").version)) throw new Error("Missing bundled decoder verification")'
            muxers=$(vendor/ffmpeg/${{ matrix.target }}/ffmpeg -hide_banner -muxers)
            grep -qw segment <<<"$muxers"
            echo '{"target":"${{ matrix.target }}","legacySegmentOnly":true}' > "$RUNNER_TEMP/ffmpeg-codecs.json"
          fi
          cat "$RUNNER_TEMP/ffmpeg-codecs.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-codecs-${{ matrix.target }}-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ffmpeg-codecs.json
          retention-days: ${{ env.KEEP_DAYS }}
          if-no-files-found: error

      # The AirPlay helper as it comes from the compiler, rebuilt only when what the script hashes
      # changes: its sources, Info.plist and flags, and the Swift compiler and SDK of this runner
      # image. Packaging signs a copy inside the app, so no release signature is ever cached.
      - name: Find the AirPlay helper's inputs
        id: airplay-key
        if: runner.os == 'macOS'
        # Assigned first, so the script's failure stops the step and cannot leave one empty key
        # shared by every build.
        run: |
          inputs=$(scripts/build-airplay-helper.sh --key ${{ matrix.target }})
          echo "key=airplay-${{ matrix.target }}-$inputs" >> "$GITHUB_OUTPUT"
      - id: airplay
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/vendor/airplay/${{ matrix.target }}
          key: ${{ steps.airplay-key.outputs.key }}
      - name: Build the AirPlay helper
        if: runner.os == 'macOS' && steps.airplay.outputs.cache-hit != 'true'
        run: scripts/build-airplay-helper.sh mac-arm64

      # The build and the disk image's notarization print their phases, which the last command
      # times: the runner's own work apart from the waits on Apple, in the job summary.
      - name: Build for macOS, signed and notarized
        if: runner.os == 'macOS'
        env:
          DEBUG: electron-notarize*
          # Dry runs happen on this repository's own labelled pull requests, so they sign too.
          CSC_FOR_PULL_REQUEST: "true"
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || { echo "::error::The $name secret is missing; see docs/maintainers/signing.md"; exit 1; }
          done
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          {
            pnpm exec electron-builder ${{ matrix.builder }} --publish never
            node scripts/notarize-dmg.ts dist/*.dmg
          } 2>&1 | node scripts/mac-release-phases.ts "Mac release phases, $VERSION from ${SHA::12}"
          rm -f "$APPLE_API_KEY"

      - name: Check the macOS signature
        if: runner.os == 'macOS'
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          app="dist/mac-arm64/Mr. Streamer.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -qx "TeamIdentifier=$TEAM_ID"
          codesign -dv "$app" 2>&1 | grep -q "flags=0x10000(runtime)"
          spctl --assess --type execute --verbose "$app"
          spctl --assess --type open --context context:primary-signature --verbose dist/*.dmg
          node scripts/stapler-ticket.ts validate "$app"
          node scripts/stapler-ticket.ts validate dist/*.dmg

      - name: Check the AirPlay helper starts
        if: runner.os == 'macOS'
        # Signed and under the hardened runtime, as it ships. With nothing to read it says hello
        # and exits.
        run: |
          said=$("dist/mac-arm64/Mr. Streamer.app/Contents/Resources/airplay/MrStreamerAirPlay" </dev/null)
          grep -q '"type":"hello"' <<<"$said"

      - name: Build for Linux
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder ${{ matrix.builder }} --publish never

      - name: Check the update metadata
        run: |
          for file in dist/latest*.yml; do
            grep -qx "version: $VERSION" "$file" || { echo "::error::$file does not name $VERSION"; exit 1; }
          done

      - name: Smoke test the installed app on macOS
        if: runner.os == 'macOS'
        run: |
          mount=$(hdiutil attach -nobrowse -readonly dist/*.dmg | tail -1 | cut -f3)
          ditto "$mount/Mr. Streamer.app" "/Applications/Mr. Streamer.app"
          hdiutil detach "$mount"
          node test/e2e/packaged-app.ts "/Applications/Mr. Streamer.app/Contents/MacOS/Mr. Streamer" -- --use-mock-keychain

      - name: Smoke test the installed app on Linux
        if: runner.os == 'Linux'
        run: |
          # AppImages need FUSE 2, as on a user's Ubuntu.
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libfuse2t64 ./dist/*.deb
          xvfb-run -a node test/e2e/packaged-app.ts "/opt/Mr. Streamer/mrstreamer" -- --no-sandbox
          xvfb-run -a node test/e2e/packaged-app.ts dist/*.AppImage -- --no-sandbox

      - id: package-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}-${{ inputs.version }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          retention-days: ${{ env.KEEP_DAYS }}
          if-no-files-found: error
      - uses: ./.workflow/.github/actions/package-receipt
        with:
          platform: ${{ matrix.target }}
          version: ${{ inputs.version }}
          sha: ${{ inputs.sha }}
          artifact-name: release-${{ matrix.target }}-${{ inputs.version }}
          artifact-id: ${{ steps.package-artifact.outputs.artifact-id }}
          artifact-digest: ${{ steps.package-artifact.outputs.artifact-digest }}
          retention-days: ${{ env.KEEP_DAYS }}

  # The Windows installer, in a job of its own: the Store package needs the ffmpeg this job caches,
  # and waits for it and for no other platform.
  package-windows:
    name: Package win-x64
    needs: bundle
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      # The cache the msix job restores. It exists once this job has succeeded, built or found.
      ffmpeg-key: ${{ steps.ffmpeg-key.outputs.key }}
    env:
      VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow
          sparse-checkout: |
            .github/actions
            apps/desktop/scripts/windows-ffmpeg-toolchain
          persist-credentials: false
      - uses: ./.workflow/.github/actions/setup
        with:
          version: ${{ inputs.version }}

      # The cache hashes the toolchain action, from the workflow commit, and the release's own
      # build script. No restore prefix: a UCRT64 build must never restore an old MINGW64 binary.
      - id: ffmpeg-key
        run: |
          test -f ../../.workflow/apps/desktop/scripts/windows-ffmpeg-toolchain/action.yml
          test -f scripts/build-ffmpeg.sh
          echo "key=ffmpeg-win-x64-ucrt64-${{ hashFiles('.workflow/apps/desktop/scripts/windows-ffmpeg-toolchain/action.yml', 'apps/desktop/scripts/build-ffmpeg.sh') }}" >> "$GITHUB_OUTPUT"
      - id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/vendor/ffmpeg/win-x64
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: ./.workflow/apps/desktop/scripts/windows-ffmpeg-toolchain
      - name: Build ffmpeg on Windows
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: scripts/build-ffmpeg.sh win-x64
      - name: Check and record Windows ffmpeg provenance
        # README.txt is cached with both binaries, including on a warm-cache run.
        run: |
          grep -q 'C runtime UCRT; MSYS2 UCRT64; packages ' vendor/ffmpeg/win-x64/README.txt
          grep -q 'mingw-w64-ucrt-x86_64-gcc ' vendor/ffmpeg/win-x64/README.txt
          cat vendor/ffmpeg/win-x64/README.txt
      - name: Check bundled media features and decode fixtures
        run: |
          if [[ -f scripts/verify-ffmpeg.ts ]]; then
            node scripts/verify-ffmpeg.ts win-x64 > "$RUNNER_TEMP/ffmpeg-codecs.json"
          else
            # An older nightly keeps its original segment check. Modern sources must have the
            # full decoder proof; promoting an older source as 0.0.16 cannot bypass it.
            node -e 'if (!/^0[.]0[.]([0-9]|1[0-5])(-|$)/.test(require("./package.json").version)) throw new Error("Missing bundled decoder verification")'
            muxers=$(vendor/ffmpeg/win-x64/ffmpeg -hide_banner -muxers)
            grep -qw segment <<<"$muxers"
            echo '{"target":"win-x64","legacySegmentOnly":true}' > "$RUNNER_TEMP/ffmpeg-codecs.json"
          fi
          cat "$RUNNER_TEMP/ffmpeg-codecs.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-codecs-win-x64-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ffmpeg-codecs.json
          retention-days: ${{ env.KEEP_DAYS }}
          if-no-files-found: error

      # Windows installers are unsigned for now. Signing belongs here, as its own step with its
      # own secrets, without touching the Mac certificate; docs/maintainers/signing.md.
      - name: Build for Windows
        run: pnpm exec electron-builder --win --x64 --publish never

      # About has a notice for each plug-in NSIS puts in the setup and its uninstaller, and the
      # release attaches their sources. A plug-in added or changed since they were reviewed stops
      # the build here; docs/maintainers/licences.md#windows-setup-program.
      - name: Check the setup's plug-ins
        run: node scripts/installer-plugins.ts dist/*-setup.exe

      - name: Check the update metadata
        run: |
          for file in dist/latest*.yml; do
            grep -qx "version: $VERSION" "$file" || { echo "::error::$file does not name $VERSION"; exit 1; }
          done

      - name: Smoke test the installed app on Windows
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          node test/e2e/packaged-app.ts "$env:LOCALAPPDATA\Programs\mrstreamer\Mr. Streamer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - id: package-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-win-x64-${{ inputs.version }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          retention-days: ${{ env.KEEP_DAYS }}
          if-no-files-found: error
      - uses: ./.workflow/.github/actions/package-receipt
        with:
          platform: win-x64
          version: ${{ inputs.version }}
          sha: ${{ inputs.sha }}
          artifact-name: release-win-x64-${{ inputs.version }}
          artifact-id: ${{ steps.package-artifact.outputs.artifact-id }}
          artifact-digest: ${{ steps.package-artifact.outputs.artifact-digest }}
          retention-days: ${{ env.KEEP_DAYS }}

  # The Microsoft Store package, an MSIX of the same app, for dry runs and stable releases: only
  # stable releases go to the Store, through publish.yml. It waits for the Windows installer and
  # no other platform. Outside a dry run its failure doesn't fail the release: publish.yml's Store
  # job then has no checksum and says so, after the release is out. Its file stays a workflow
  # artifact: never on the release or in the update feed.
  msix:
    name: Package Microsoft Store MSIX
    needs: package-windows
    if: inputs.dry-run || inputs.channel == 'stable'
    continue-on-error: ${{ !inputs.dry-run }}
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      # The package's checksum, which the Store job compares with the file it downloads.
      sha256: ${{ steps.check.outputs.sha256 }}
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
      # A release's package is the one the Store gets, at once or in a later run, so it's kept
      # longer.
      MSIX_DAYS: ${{ inputs.dry-run && 14 || 90 }}
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      # The setup, and the Store's identity that the package check holds the package to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow
          sparse-checkout: |
            .github/actions
            scripts
            packages/contracts/src
          persist-credentials: false
      - uses: ./.workflow/.github/actions/setup
        with:
          version: ${{ inputs.version }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/vendor/ffmpeg/win-x64
          key: ${{ needs.package-windows.outputs.ffmpeg-key }}
          fail-on-cache-miss: true
      - name: Build the MSIX
        run: pnpm exec electron-builder --win appx --x64 --publish never

      # Partner Center's identity exactly, the Store name, the Store version for this release
      # (scripts/store-release.ts holds all three), and what the app needs at run time: ffmpeg,
      # ffprobe and the notices Settings > About reads. The record the check writes beside the
      # package ties the file to the release and its commit by checksum.
      - name: Check the package
        id: check
        run: |
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          & $makeappx.FullName unpack /p "dist/Mr-Streamer-$env:VERSION-win-x64.msix" /d "$env:RUNNER_TEMP\msix" /o | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../../.workflow/scripts/store-release.ts package --manifest "$env:RUNNER_TEMP\msix\AppxManifest.xml" `
            --dir dist --version $env:VERSION --sha $env:SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in "Mr. Streamer.exe", "resources\app.asar", "resources\ffmpeg\ffmpeg.exe",
              "resources\ffmpeg\ffprobe.exe", "LICENSES.chromium.html", "LICENSE.electron.txt") {
            if (-not (Test-Path -LiteralPath "$env:RUNNER_TEMP\msix\app\$file")) { echo "::error::The package has no $file."; exit 1 }
          }

      # Windows installs only signed packages. A certificate made here, with the package's
      # publisher as its subject and trusted on this runner alone, signs a copy to install; the
      # artifact stays unsigned for the Store to sign. Installing proves nothing about Store trust;
      # docs/maintainers/signing.md#microsoft-store-package.
      - name: Install a test-signed copy
        run: |
          [xml]$manifest = Get-Content "$env:RUNNER_TEMP\msix\AppxManifest.xml"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $manifest.Package.Identity.Publisher `
            -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\test.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          Copy-Item "dist/Mr-Streamer-$env:VERSION-win-x64.msix" "$env:RUNNER_TEMP\test.msix"
          & $signtool.FullName sign /q /fd SHA256 /sha1 $cert.Thumbprint "$env:RUNNER_TEMP\test.msix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-AppxPackage "$env:RUNNER_TEMP\test.msix"
          # Windows derives the family name from the identity: it must be the one Partner Center gave.
          $family = (Get-AppxPackage "${{ steps.check.outputs.identity-name }}").PackageFamilyName
          if ($family -cne "${{ steps.check.outputs.family-name }}") { echo "::error::Installed as $family."; exit 1 }

      # Started by its path, the app runs with the package's identity, as it does from Start, so
      # the test also expects it to leave updates to the Store.
      - name: Smoke test the installed package
        run: |
          $package = Get-AppxPackage "${{ steps.check.outputs.identity-name }}"
          node test/e2e/packaged-app.ts (Join-Path $package.InstallLocation "app\Mr. Streamer.exe")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Started as a user would, a Store copy keeps its data in a folder of its own inside the
      # package's, apart from a direct copy's; docs/contributing/architecture.md#data.
      - name: Check where the Store copy keeps its data
        run: |
          $package = Get-AppxPackage "${{ steps.check.outputs.identity-name }}"
          Start-Process -FilePath (Join-Path $package.InstallLocation "app\Mr. Streamer.exe")
          Start-Sleep 15
          Get-Process "Mr. Streamer" -ErrorAction SilentlyContinue | Stop-Process -Force
          $own = "$env:LOCALAPPDATA\Packages\$($package.PackageFamilyName)\LocalCache\Roaming\Mr. Streamer Store"
          if (-not (Test-Path "$own\Local State")) { echo "::error::Nothing in $own."; exit 1 }
          if (Test-Path "$env:APPDATA\Mr. Streamer Store") { echo "::error::The Store copy wrote to the real AppData."; exit 1 }

      # The kit's report goes with the package. Its optional "Blocked executables" test fails: it
      # flags strings such as "cmd" and "reg" inside Electron's and ffmpeg's files. The overall
      # result has to pass.
      - name: Windows App Certification Kit
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          # The kit takes only a full path for its report.
          $report = Join-Path (Resolve-Path dist) "Mr-Streamer-$env:VERSION-win-x64.wack.xml"
          & $appcert reset | Out-Null
          & $appcert test -appxpackagepath "$env:RUNNER_TEMP\test.msix" -reportoutputpath $report
          [xml]$xml = Get-Content $report
          foreach ($test in $xml.SelectNodes("//TEST[RESULT != 'PASS']")) {
            $optional = if ($test.OPTIONAL -eq "TRUE") { " (optional)" } else { "" }
            echo "$($test.SelectSingleNode('RESULT').InnerText) $($test.NAME)$optional"
          }
          $overall = $xml.REPORT.OVERALL_RESULT
          Add-Content $env:GITHUB_STEP_SUMMARY "Windows App Certification Kit: $overall"
          if ($overall -ne "PASS") { echo "::error::The certification kit's result is $overall."; exit 1 }

      # Uninstalling removes what the package wrote to AppData along with it.
      - name: Uninstall
        run: |
          $package = Get-AppxPackage "${{ steps.check.outputs.identity-name }}"
          Remove-AppxPackage $package.PackageFullName
          if (Test-Path "$env:LOCALAPPDATA\Packages\$($package.PackageFamilyName)") {
            echo "::error::Uninstalling left the package's data behind."
            exit 1
          }

      # Only a package that passed every step above gets this name, which is the one the Store
      # job and a submission by hand take it under.
      - id: package-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msix-${{ inputs.version }}
          path: |
            apps/desktop/dist/*.msix
            apps/desktop/dist/*.msix.json
            apps/desktop/dist/*.wack.xml
          retention-days: ${{ env.MSIX_DAYS }}
          if-no-files-found: error
      - uses: ./.workflow/.github/actions/package-receipt
        with:
          platform: win-x64
          distribution: store
          version: ${{ inputs.version }}
          package-version: ${{ steps.check.outputs.package-version }}
          sha: ${{ inputs.sha }}
          artifact-name: msix-${{ inputs.version }}
          artifact-id: ${{ steps.package-artifact.outputs.artifact-id }}
          artifact-digest: ${{ steps.package-artifact.outputs.artifact-digest }}
          retention-days: ${{ env.MSIX_DAYS }}
      # What a failed check left, to look at. Never submitted.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: msix-failed-${{ inputs.version }}
          path: |
            apps/desktop/dist/*.msix
            apps/desktop/dist/*.msix.json
            apps/desktop/dist/*.wack.xml
          retention-days: 14

  # The source archives the installers' licences ask for, which every release attaches: FFmpeg and
  # x264, Chromium's FFmpeg and Electron, and the Windows setup's plug-ins. Each is checked against
  # its pinned SHA-256 or commit, and the notices built into the app have to link exactly these
  # files; docs/maintainers/licences.md#sources-on-every-release. Dry runs prepare and check them
  # too, so a missing or changed source shows before a release needs it. As a release-* artifact,
  # the archives reach publish with the installers.
  sources:
    name: Prepare sources
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      files: ${{ steps.prepare.outputs.files }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow
          sparse-checkout: .github/actions
          persist-credentials: false
      # The notices link the sources on the release of this version.
      - uses: ./.workflow/.github/actions/setup
        with:
          version: ${{ inputs.version }}
      - id: prepare
        run: node scripts/release-sources.ts "$RUNNER_TEMP/sources"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sources-${{ inputs.version }}
          path: ${{ runner.temp }}/sources/
          retention-days: ${{ env.KEEP_DAYS }}
          if-no-files-found: error
