# Installs the prior stable release, a published nightly A and a later release dry run B over one
# another on a disposable Windows runner, on one profile, and checks what each upgrade keeps, B
# with the subscription removed and the app and its ffmpeg blocked from the network.
# apps/desktop/test/e2e/installed-upgrade.ts runs it; docs/contributing/testing.md#installed-upgrade
# describes it.
#
# By hand from main only, with all four pins: nothing is looked up as "latest". It reads releases,
# runs and artifacts and publishes nothing: no release, feed, Store or tag, and it holds no secret.
# The run's evidence is kept 14 days; a failed run's profile 7.
# Published-pair mode instead installs an explicitly pinned stable and published nightly, then
# restarts that same nightly for retained-copy/offline checks. Mode-specific pins never mix.
name: Windows installed upgrade

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Legacy three-build chain or published stable to exact nightly with a restart
        type: choice
        options:
          - legacy
          - published-pair
        default: legacy
        required: true
      a-tag:
        description: Published nightly A, such as v0.0.10-nightly.20261010.282
        type: string
        required: false
      a-sha:
        description: The full commit A's tag names
        type: string
        required: false
      b-run:
        description: Run id of a successful release dry run of a pull request, made after A
        type: string
        required: false
      b-sha:
        description: The full commit that dry run built
        type: string
        required: false
      stable-tag:
        description: Published-pair only. Exact stable tag, including v
        type: string
        required: false
      stable-sha:
        description: Published-pair only. Full lowercase commit the stable tag names
        type: string
        required: false
      candidate-tag:
        description: Published-pair only. Exact published nightly tag, including v
        type: string
        required: false
      candidate-sha:
        description: Published-pair only. Full lowercase commit the candidate tag names
        type: string
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: read

# One at a time, and never cancelled: a run cut short could leave its firewall rules on its runner.
concurrency:
  group: windows-installed-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    name: Install and upgrade on Windows
    if: >-
      github.repository == 'Mr-Streamer-OSS/MrStreamer'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # The check drives the installed app; it needs no Electron of its own.
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Find and check the three installers
        env:
          GH_TOKEN: ${{ github.token }}
          A_TAG: ${{ inputs.a-tag }}
          A_SHA: ${{ inputs.a-sha }}
          B_RUN: ${{ inputs.b-run }}
          B_SHA: ${{ inputs.b-sha }}
          MODE: ${{ inputs.mode || 'legacy' }}
          STABLE_TAG: ${{ inputs.stable-tag }}
          STABLE_SHA: ${{ inputs.stable-sha }}
          CANDIDATE_TAG: ${{ inputs.candidate-tag }}
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        run: |
          case "$MODE" in
            legacy)
              for name in A_TAG A_SHA B_RUN B_SHA; do
                test -n "${!name}" || { echo "Missing legacy pin: $name" >&2; exit 2; }
              done
              for name in STABLE_TAG STABLE_SHA CANDIDATE_TAG CANDIDATE_SHA; do
                test -z "${!name}" || { echo "Mixed mode input: $name" >&2; exit 2; }
              done
              node apps/desktop/test/e2e/installed-upgrade.ts resolve --a-tag "$A_TAG" --a-sha "$A_SHA" \
                --b-run "$B_RUN" --b-sha "$B_SHA" --out "$RUNNER_TEMP/installed-upgrade-packages"
              ;;
            published-pair)
              for name in STABLE_TAG STABLE_SHA CANDIDATE_TAG CANDIDATE_SHA; do
                test -n "${!name}" || { echo "Missing published-pair pin: $name" >&2; exit 2; }
              done
              for name in A_TAG A_SHA B_RUN B_SHA; do
                test -z "${!name}" || { echo "Mixed mode input: $name" >&2; exit 2; }
              done
              node apps/desktop/test/e2e/installed-upgrade.ts resolve-published --stable-tag "$STABLE_TAG" \
                --stable-sha "$STABLE_SHA" --candidate-tag "$CANDIDATE_TAG" --candidate-sha "$CANDIDATE_SHA" \
                --out "$RUNNER_TEMP/installed-upgrade-packages"
              ;;
            *) echo "Unknown installed-upgrade mode" >&2; exit 2 ;;
          esac
      - name: Install, retain state and check offline copies
        env:
          MODE: ${{ inputs.mode || 'legacy' }}
        run: |
          case "$MODE" in
            legacy) command=run ;;
            published-pair) command=run-published ;;
            *) echo "Unknown installed-upgrade mode" >&2; exit 2 ;;
          esac
          node apps/desktop/test/e2e/installed-upgrade.ts "$command" \
            --packages "$RUNNER_TEMP/installed-upgrade-packages" --root "$RUNNER_TEMP/installed-upgrade"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/installed-upgrade-packages/receipt.json
            ${{ runner.temp }}/installed-upgrade/evidence/
            ${{ runner.temp }}/installed-upgrade/profile.lock
          retention-days: 14
          if-no-files-found: warn
      # What a failure left, to look at: the fake subscription's profile, without Chromium's caches.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: installed-upgrade-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/installed-upgrade/profile/
            !${{ runner.temp }}/installed-upgrade/profile/**/Cache/
            !${{ runner.temp }}/installed-upgrade/profile/**/Code Cache/
            !${{ runner.temp }}/installed-upgrade/profile/**/GPUCache/
            !${{ runner.temp }}/installed-upgrade/profile/**/DawnGraphiteCache/
            !${{ runner.temp }}/installed-upgrade/profile/**/DawnWebGPUCache/
          retention-days: 7
          if-no-files-found: ignore
