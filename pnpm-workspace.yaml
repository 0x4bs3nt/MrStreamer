packages:
  - apps/*
  - packages/*
  # The iOS app keeps its own install and lockfile, so React Native never enters the desktop's.
  - "!apps/ios"
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  sharp: true
  workerd: false

# Reviewed patch releases; keep age exceptions specific to the selected versions.
minimumReleaseAgeExclude:
  - "@tanstack/react-virtual@3.14.22"
  - "@tanstack/virtual-core@3.19.7"
  - "@cloudflare/workers-types@5.20261025.1"
  # Reviewed updater fixes; remove these age exceptions after 27 October 2026 12:35 UTC.
  - "electron-updater@6.8.12"
  - "builder-util-runtime@9.7.1"
# Local provider tests only; remove each override when Miniflare carries the fixed version.
overrides:
  "miniflare@4.20260730.0>undici": "7.30.1"
  "miniflare@4.20260730.0>sharp": "0.35.5"
# Keep accepted app notarization single-shot; retry only CloudKit ticket download during stapling.
patchedDependencies:
  "@electron/notarize@2.5.0": patches/@electron__notarize@2.5.0.patch
# electron-vite and electron-builder look for electron from their own install location.
publicHoistPattern:
  - electron
